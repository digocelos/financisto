services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financisto
      POSTGRES_USER: financisto
      POSTGRES_PASSWORD: financisto
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financisto -d financisto"]
      interval: 3s
      timeout: 3s
      retries: 10

  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.2.1
    ports:
      - "8081:8080"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://financisto:financisto@postgres:5432/financisto?sslmode=disable
      OIDC_ISSUER_URL: http://mock-oauth2-server:8080/default
      OIDC_CLIENT_ID: financisto-local
      OIDC_CLIENT_SECRET: financisto-local-secret
      OIDC_REDIRECT_URL: http://localhost:5173/auth/callback
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-oauth2-server:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
